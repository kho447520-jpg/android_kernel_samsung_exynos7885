name: Build EurekaV2 (GCC)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - a10.config
          - a20.config
          - a30.config
          - a30s.config
          - a40.config

    steps:
      - name: Checkout kernel source (EurekaV2)
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

      - name: Enable KernelSU in config
        working-directory: ./kernel
        run: |
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/${{ matrix.defconfig }}
          tail -10 arch/arm64/configs/${{ matrix.defconfig }}

      - name: Install GCC (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison flex libssl-dev make git python3 cpio zip libelf-dev \
            gcc-aarch64-linux-gnu

      - name: Set environment (GCC)
        run: |
          {
            echo "CC=aarch64-linux-gnu-gcc"
            echo "LD=aarch64-linux-gnu-ld"
            echo "AR=aarch64-linux-gnu-ar"
            echo "NM=aarch64-linux-gnu-nm"
            echo "OBJCOPY=aarch64-linux-gnu-objcopy"
            echo "OBJDUMP=aarch64-linux-gnu-objdump"
            echo "STRIP=aarch64-linux-gnu-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
          } >> $GITHUB_ENV

      - name: Fix source & Configure
        working-directory: ./kernel
        run: |
          rm -rf out
          mkdir -p out
          export PLATFORM_VERSION=11
          
          # Vô hiệu hóa sl_softirq trực tiếp trong source
          sed -i 's/sl_softirq_entry(/\/\/ sl_softirq_entry(/g' kernel/softirq.c
          sed -i 's/sl_softirq_exit(/\/\/ sl_softirq_exit(/g' kernel/softirq.c

          # Vô hiệu hóa driver GPU trong Makefile (tránh lỗi thiếu built-in.o)
          sed -i 's/obj-$(CONFIG_MALI_MIDGARD)/# obj-$(CONFIG_MALI_MIDGARD)/g' drivers/gpu/Makefile 2>/dev/null || true
          sed -i 's/obj-y.*arm/# obj-y arm/g' drivers/gpu/Makefile 2>/dev/null || true

          # Copy file config vào out/.config
          cp arch/arm64/configs/${{ matrix.defconfig }} out/.config

          # Sửa giá trị rỗng của TZDEV
          sed -i 's/^CONFIG_TZDEV_IWI_EVENT=.*/CONFIG_TZDEV_IWI_EVENT=0/' out/.config
          sed -i 's/^CONFIG_TZDEV_IWI_PANIC=.*/CONFIG_TZDEV_IWI_PANIC=0/' out/.config
          grep -q "^CONFIG_TZDEV_IWI_EVENT" out/.config || echo "CONFIG_TZDEV_IWI_EVENT=0" >> out/.config
          grep -q "^CONFIG_TZDEV_IWI_PANIC" out/.config || echo "CONFIG_TZDEV_IWI_PANIC=0" >> out/.config

          # Tắt Mali và thêm cấu hình cần thiết
          {
            echo "# CONFIG_MALI_MIDGARD is not set"
            echo "# CONFIG_MALI_EXYNOS is not set"
            echo "# CONFIG_LOCALVERSION is not set"
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_DEBUG_INFO is not set"
          } >> out/.config

          make ARCH=arm64 O=out olddefconfig

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make -j2 O=out ARCH=arm64 \
            LOCALVERSION="${LOCALVERSION}" \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} 2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log

      - name: Prepare AnyKernel
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel 2>/dev/null || cp -r kernel/AnyKernel3 anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip