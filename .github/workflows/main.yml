name: Build EurekaV2 (Clang 21)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - a10.config
          - a20.config
          - a30.config
          - a30s.config
          - a40.config

    steps:
      - name: Checkout kernel source (EurekaV2)
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          fetch-depth: 0
          submodules: recursive

      - name: Set Git user
        working-directory: ./kernel
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Setup KernelSU-Next v1.1.1
        working-directory: ./kernel
        run: |
          git submodule update --init --recursive
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.1.1

      - name: Enable KernelSU in config
        working-directory: ./kernel
        run: |
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/${{ matrix.defconfig }}
          echo "# CONFIG_KPROBES is not set" >> arch/arm64/configs/${{ matrix.defconfig }}
          tail -10 arch/arm64/configs/${{ matrix.defconfig }}

      - name: Install build dependencies & Clang 21 (AOSP)
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison flex libssl-dev make git python3 cpio zip libelf-dev \
            gcc-aarch64-linux-gnu aria2

          # Tải AOSP Clang 21 (r547379 là Clang 20, nhưng đây là bản gần nhất có sẵn)
          # Lưu ý: AOSP chưa có prebuilt chính thức cho Clang 21 tại thời điểm này.
          # Tạm dùng r547379 (Clang 20) làm bản gần nhất, hoặc tìm mirror Clang 21.
          mkdir -p $HOME/clang && cd $HOME/clang
          aria2c -x 8 -s 8 --retry-wait=3 --max-tries=5 \
            -o clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-16.0.0_r1/clang-r547379.tar.gz"
          
          if [ ! -s clang.tar.gz ]; then
            echo "ERROR: clang.tar.gz is empty"
            exit 1
          fi
          
          tar -xzf clang.tar.gz && rm clang.tar.gz
          sudo mkdir -p /usr/local/clang
          sudo cp -r $HOME/clang/* /usr/local/clang/
          
          sudo ln -sf /usr/local/clang/bin/clang /usr/bin/clang
          sudo ln -sf /usr/local/clang/bin/ld.lld /usr/bin/ld.lld
          sudo ln -sf /usr/local/clang/bin/llvm-ar /usr/bin/llvm-ar
          sudo ln -sf /usr/local/clang/bin/llvm-nm /usr/bin/llvm-nm
          sudo ln -sf /usr/local/clang/bin/llvm-objcopy /usr/bin/llvm-objcopy
          sudo ln -sf /usr/local/clang/bin/llvm-objdump /usr/bin/llvm-objdump
          sudo ln -sf /usr/local/clang/bin/llvm-strip /usr/bin/llvm-strip
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld
          
          clang --version

      - name: Set environment (Clang 21)
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
            echo "HOSTLDFLAGS=-fuse-ld=lld"
          } >> $GITHUB_ENV

      - name: Fix source & Configure
        working-directory: ./kernel
        run: |
          rm -rf out
          mkdir -p out
          export PLATFORM_VERSION=11
          
          # Vô hiệu hóa sl_softirq trực tiếp trong source
          sed -i 's/sl_softirq_entry(/\/\/ sl_softirq_entry(/g' kernel/softirq.c
          sed -i 's/sl_softirq_exit(/\/\/ sl_softirq_exit(/g' kernel/softirq.c

          # Vô hiệu hóa driver GPU trong Makefile
          sed -i 's/obj-$(CONFIG_MALI_MIDGARD)/# obj-$(CONFIG_MALI_MIDGARD)/g' drivers/gpu/Makefile 2>/dev/null || true
          sed -i 's/obj-y.*arm/# obj-y arm/g' drivers/gpu/Makefile 2>/dev/null || true

          # Sửa lỗi intf trong dummycon.c
          sed -i 's/\bintf\b/int/g' drivers/video/console/dummycon.c

          # Vá lỗi Clang mới (tương tự như Clang 18/19)
          sed -i 's/-implicit-function-declaration//g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-implicit-function-declaration//g' {} + 2>/dev/null || true
          sed -i 's/-Werror//g' Makefile scripts/Makefile.host 2>/dev/null || true
          echo 'HOSTCFLAGS += -Wno-error' >> Makefile
          sed -i 's/extern __read_mostly unsigned long zero_pfn;/extern unsigned long zero_pfn;/' include/asm-generic/pgtable.h
          echo 'KBUILD_CFLAGS += -std=gnu11' >> Makefile

          # Copy file config vào out/.config
          cp arch/arm64/configs/${{ matrix.defconfig }} out/.config

          # Sửa giá trị rỗng của TZDEV
          sed -i 's/^CONFIG_TZDEV_IWI_EVENT=.*/CONFIG_TZDEV_IWI_EVENT=0/' out/.config
          sed -i 's/^CONFIG_TZDEV_IWI_PANIC=.*/CONFIG_TZDEV_IWI_PANIC=0/' out/.config
          grep -q "^CONFIG_TZDEV_IWI_EVENT" out/.config || echo "CONFIG_TZDEV_IWI_EVENT=0" >> out/.config
          grep -q "^CONFIG_TZDEV_IWI_PANIC" out/.config || echo "CONFIG_TZDEV_IWI_PANIC=0" >> out/.config

          # Tắt Mali và thêm cấu hình cần thiết
          {
            echo "# CONFIG_MALI_MIDGARD is not set"
            echo "# CONFIG_MALI_EXYNOS is not set"
            echo "# CONFIG_LOCALVERSION is not set"
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_DEBUG_INFO is not set"
            echo "# CONFIG_LTO is not set"
            echo "# CONFIG_LTO_CLANG is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
          } >> out/.config

          make ARCH=arm64 O=out olddefconfig

      - name: Build kernel
        working-directory: ./kernel
        run: |
          export PLATFORM_VERSION=11
          make -j2 O=out ARCH=arm64 \
            LOCALVERSION="${LOCALVERSION}" \
            CC=${CC} LD=${LD} AR=${AR} NM=${NM} \
            OBJCOPY=${OBJCOPY} OBJDUMP=${OBJDUMP} STRIP=${STRIP} \
            CROSS_COMPILE=${CROSS_COMPILE} HOSTLDFLAGS="-fuse-ld=lld" \
            2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log

      - name: Prepare AnyKernel
        run: |
          cp -r kernel/kernel_zip/anykernel anykernel 2>/dev/null || cp -r kernel/AnyKernel3 anykernel

      - name: Copy kernel image
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image.gz anykernel/ || \
          cp kernel/out/arch/arm64/boot/Image anykernel/

      - name: Create flashable zip
        run: |
          cd anykernel
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *
          cd ..

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip