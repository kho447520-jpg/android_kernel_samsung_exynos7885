name: Build Exynos7885 (EurekaV2 - GCC)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source (EurekaV2)
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          submodules: recursive

      - name: Install GCC (Ubuntu)
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison flex libssl-dev make git python3 cpio zip libelf-dev \
            gcc-aarch64-linux-gnu

      - name: Configure & Build (GCC)
        working-directory: ./kernel
        run: |
          rm -rf out
          mkdir -p out
          export PLATFORM_VERSION=11

          # --- Copy file a10.config ---
          if [ -f "a10.config" ]; then
            cp a10.config out/.config
          elif [ -f "arch/arm64/configs/a10.config" ]; then
            cp arch/arm64/configs/a10.config out/.config
          else
            echo "ERROR: Không tìm thấy a10.config"
            find . -name "*a10*" -o -name "*.config" | head -20
            exit 1
          fi

          # --- Vô hiệu hóa sl_softirq trực tiếp trong source code ---
          sed -i 's/sl_softirq_entry(/\/\/ sl_softirq_entry(/g' kernel/softirq.c
          sed -i 's/sl_softirq_exit(/\/\/ sl_softirq_exit(/g' kernel/softirq.c

          # --- Bật driver GPU Mali (nếu bị tắt trong a10.config) ---
          echo "CONFIG_MALI_MIDGARD=y" >> out/.config
          echo "CONFIG_MALI_PLATFORM_NAME=\"exynos\"" >> out/.config
          echo "CONFIG_MALI_EXYNOS=y" >> out/.config

          # --- Thêm cấu hình cần thiết ---
          {
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_DEBUG_INFO is not set"
            echo "# CONFIG_LTO is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "CONFIG_TZDEV_IWI_EVENT=0"
            echo "CONFIG_TZDEV_IWI_PANIC=0"
          } >> out/.config

          # Resolve dependencies
          make ARCH=arm64 O=out olddefconfig

          echo "=== Verify config ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64|CONFIG_LTO|CONFIG_MALI" out/.config || true

          # --- Build với GCC ---
          make -j2 ARCH=arm64 O=out \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-a10
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/AnyKernel3 ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_A10.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_A10
          path: HaubaiKernel_A10.zip
          if-no-files-found: warn