name: Build Exynos7885 (EurekaV2 - Neutron Clang)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source (EurekaV2)
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      - name: Setup Neutron Clang
        run: |
          mkdir -p toolchain
          cd toolchain
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") -S=10032024
          bash <(curl -s "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman") --patch=glibc
          cd ..
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Set environment (Neutron Clang)
        run: |
          {
            echo "CC=clang"
            echo "LD=ld.lld"
            echo "AR=llvm-ar"
            echo "NM=llvm-nm"
            echo "OBJCOPY=llvm-objcopy"
            echo "OBJDUMP=llvm-objdump"
            echo "STRIP=llvm-strip"
            echo "CROSS_COMPILE=aarch64-linux-gnu-"
            echo "ARCH=arm64"
            echo "HOSTLDFLAGS=-fuse-ld=lld"
          } >> $GITHUB_ENV

      - name: Fix Neutron Clang compatibility for kernel 4.4
        working-directory: ./kernel
        run: |
          # 1. Xóa cờ -implicit-function-declaration (Neutron Clang 19 không hỗ trợ)
          sed -i 's/-implicit-function-declaration//g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-implicit-function-declaration//g' {} + 2>/dev/null || true
          
          # 2. Xóa -Werror để tránh Clang coi warning là lỗi
          sed -i 's/-Werror//g' Makefile scripts/Makefile.host 2>/dev/null || true
          echo 'HOSTCFLAGS += -Wno-error' >> Makefile
          
          # 3. Sửa lỗi section attribute (Neutron Clang 19 cũng bị)
          sed -i 's/extern __read_mostly unsigned long zero_pfn;/extern unsigned long zero_pfn;/' include/asm-generic/pgtable.h
          
          # 4. Ép chuẩn C11 (tránh lỗi bool/true/false của C23)
          echo 'KBUILD_CFLAGS += -std=gnu11' >> Makefile
          
          # 5. Xóa cờ LTO của Clang (nếu có)
          sed -i 's/-flto=thin//g; s/-flto=full//g; s/-flto=auto//g' Makefile
          find . -name "Makefile*" -exec sed -i 's/-flto=thin//g' {} + 2>/dev/null || true

      - name: Configure & Build (Neutron Clang)
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11

          # Cấu hình
          make ARCH=arm64 O=out exynos7885-a10_defconfig

          {
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_DEBUG_INFO is not set"
            echo "# CONFIG_LTO is not set"
            echo "# CONFIG_LTO_CLANG is not set"
            echo "# CONFIG_LTO_CLANG_THIN is not set"
            echo "# CONFIG_THINLTO is not set"
            echo "# CONFIG_CC_STACKPROTECTOR_STRONG is not set"
            echo "# CONFIG_FRAME_POINTER is not set"
            echo "# CONFIG_ARM64_ERRATUM_843419 is not set"
          } >> out/.config

          make ARCH=arm64 O=out olddefconfig

          echo "=== Verify config ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64|CONFIG_LTO|CONFIG_KSU" out/.config || true

          # Build
          make -j2 ARCH=arm64 O=out \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            HOSTLDFLAGS="-fuse-ld=lld" \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-a10
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/AnyKernel3 ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_A10.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_A10
          path: HaubaiKernel_A10.zip
          if-no-files-found: warn