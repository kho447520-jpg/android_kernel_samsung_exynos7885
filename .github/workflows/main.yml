name: Build Exynos7885 (EurekaV2)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig 

    steps:
      - name: Checkout kernel source (EurekaV2)
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          submodules: recursive

      - name: Install build dependencies (Ubuntu GCC)
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      - name: Increase swap space
        run: |
          if swapon --show | grep -q "/swapfile"; then exit 0; fi
          sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h

      - name: Auto-detect defconfig
        working-directory: ./kernel
        run: |
          echo "=== Danh sách defconfig có sẵn trong arch/arm64/configs/ ==="
          ls -la arch/arm64/configs/ | grep -i "exynos" || echo "Không tìm thấy exynos"
          echo ""
          echo "=== Toàn bộ file trong arch/arm64/configs/ ==="
          ls -la arch/arm64/configs/

      - name: Configure & Build kernel (GCC)
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11
          
          # BẮT BUỘC có ARCH=arm64
          make ARCH=arm64 O=out ${{ matrix.defconfig }}

          # Thêm cấu hình
          {
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_IMG_DTB is not set"
            echo "# CONFIG_DEBUG_INFO is not set"
          } >> out/.config

          make ARCH=arm64 O=out olddefconfig

          echo "=== Verify config ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_BUILD_ARM64" out/.config || true

          # Build với GCC (an toàn cho kernel 4.4)
          make -j2 ARCH=arm64 O=out \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/AnyKernel3 ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn