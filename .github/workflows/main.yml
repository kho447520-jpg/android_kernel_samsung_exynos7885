name: Build Exynos7885 (kho447520-jpg kernel)
on:
  workflow_dispatch:

env:
  LOCALVERSION: "-Haubai"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        defconfig:
          - exynos7885-a10_defconfig
          - exynos7885-a20_defconfig
          - exynos7885-a30_defconfig
          - exynos7885-a30s_defconfig
          - exynos7885-a40_defconfig

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: kho447520-jpg/android_kernel_samsung_exynos7885
          ref: EurekaV2
          path: kernel
          submodules: recursive

      - name: Install build dependencies (GCC)
        run: |
          sudo apt update
          sudo apt install -y bc bison flex libssl-dev make git python3 cpio \
            gcc-aarch64-linux-gnu zip libelf-dev pkg-config device-tree-compiler

      - name: Increase swap space to prevent OOM
        run: |
          if swapon --show | grep -q "/swapfile"; then exit 0; fi
          sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile
          free -h

      - name: Configure & Build kernel (GCC)
        working-directory: ./kernel
        run: |
          rm -rf out
          export PLATFORM_VERSION=11
          
          # Cấu hình defconfig
          make O=out ${{ matrix.defconfig }}

          # Thêm các tùy chọn cần thiết
          {
            echo 'CONFIG_LOCALVERSION="-Haubai"'
            echo "CONFIG_BUILD_ARM64_APPENDED_DTB_IMAGE=y"
            echo "CONFIG_IMG_GZ_DTB=y"
            echo "# CONFIG_IMG_DTB is not set"
            echo "# CONFIG_DEBUG_INFO is not set"
            # Tắt các erratum nếu cần thiết để giảm tải
            echo "# CONFIG_ARM64_ERRATUM_843419 is not set"
          } >> out/.config

          make O=out olddefconfig

          echo "=== Verify config ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_BUILD_ARM64" out/.config || true

          # Build với GCC (an toàn cho kernel 4.4)
          make -j2 O=out \
            ARCH=arm64 \
            CC=aarch64-linux-gnu-gcc \
            CROSS_COMPILE=aarch64-linux-gnu- \
            2>&1 | tee build.log

      - name: Show artifacts
        if: always()
        working-directory: ./kernel
        run: |
          [ -f out/include/config/kernel.release ] && echo "kernel.release: $(cat out/include/config/kernel.release)" || true
          ls -la out/arch/arm64/boot/ || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.defconfig }}
          path: kernel/build.log
          if-no-files-found: warn

      - name: Package zip
        if: success()
        run: |
          cp -r kernel/kernel_zip/anykernel ak && cd ak
          if [ -f ../kernel/out/arch/arm64/boot/Image.gz-dtb ]; then cp ../kernel/out/arch/arm64/boot/Image.gz-dtb .
          elif [ -f ../kernel/out/arch/arm64/boot/Image.gz ]; then cp ../kernel/out/arch/arm64/boot/Image.gz .
          else cp ../kernel/out/arch/arm64/boot/Image .; fi
          zip -r9 ../HaubaiKernel_${{ matrix.defconfig }}.zip *

      - name: Upload zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HaubaiKernel_${{ matrix.defconfig }}
          path: HaubaiKernel_${{ matrix.defconfig }}.zip
          if-no-files-found: warn
